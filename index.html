<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Boss Respawn Timer</title>

<style>





.row{
    position:relative;
    z-index:1;

    background:
        linear-gradient(135deg,rgba(255,219,130,0.11),rgba(255,255,255,0.025)),
        rgba(9,8,6,0.43);
    border:1px solid rgba(206,158,55,0.34);
    border-left:4px solid rgba(255,213,79,0.9);
    border-radius:4px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.1),
        0 0 14px rgba(0,0,0,0.22);
    backdrop-filter:blur(3px) saturate(1.08);
    -webkit-backdrop-filter:blur(3px) saturate(1.08);

    margin:12px 0; /* ✅ spacing fix */
}

/* GLOW */
.row::after{
    content:"";
    position:absolute;
    inset:-2px; /* not too big */
    border-radius:12px;
    pointer-events:none;
    opacity:0;
    z-index:-1; /* ✅ ALWAYS behind */
}

/* NEXT should be top */
.next{
    z-index:5;
}


/* ===== NEXT BOSS (BLUE GLOW) ===== */
.next::after{
    box-shadow:
        0 0 12px #00e5ff,
        0 0 30px #00e5ff,
        0 0 55px #00e5ff;
    opacity:1;
}

.next{
    z-index:5; /* 🔥 only top highlight wins */
}

/* ===== ALIVE (GREEN BLINK) ===== */
.alive::after{
    box-shadow:
        0 0 10px #00ff9c,
        0 0 25px #00ff9c,
        0 0 45px #00ff9c;
    animation:glowGreen 1.2s infinite ease-in-out;
}

/* ===== TODAY (SOFT YELLOW) ===== */
.today::after{
    box-shadow:
        0 0 10px #ffd54f,
        0 0 20px #ffd54f;
    opacity:0.6;
}

/* ===== SOON (RED BLINK) ===== */
/* 🔴 STATIC RED (DEFAULT) */
.row.soon::after{
    box-shadow:
        0 0 10px #ff4d4d,
        0 0 25px #ff4d4d,
        0 0 45px #ff4d4d;
}

/* 🔴 BLINK ONLY WHEN .blink IS ALSO PRESENT */
.row.soon.blink::after{
    animation:glowRed 1s infinite ease-in-out;
}

/* ✅ ADD THIS RIGHT HERE 👇 */
.today-row{
    position:relative;
    z-index:1;
}

.today-row.soon::after{
    content:"";
    position:absolute;
    inset:-2px;
    border-radius:12px;
    pointer-events:none;

    box-shadow:
        0 0 10px #ff4d4d,
        0 0 25px #ff4d4d,
        0 0 45px #ff4d4d;

    opacity:1;
}

.today-row.soon.blink::after{
    animation:glowRed 1s infinite ease-in-out;
}
/* ===== ANIMATIONS ===== */
@keyframes glowGreen{
    0%{opacity:0.2;}
    50%{opacity:1;}
    100%{opacity:0.2;}
}

@keyframes glowRed{
    0%{opacity:0.3;}
    50%{opacity:1;}
    100%{opacity:0.3;}
}

/* ===== GLOBAL ===== */
body{
    margin:0;
    background: url('wallpaper.jpeg') center/cover no-repeat fixed;
    font-family:'Segoe UI','Inter',sans-serif;
    color:#eee;
    min-height:100vh;
    overflow-x:hidden;
}

/* 🔥 DARK OVERLAY (PUT RIGHT UNDER body) */
body::before{
    pointer-events:none;
    content:"";
    position:fixed;
    inset:0;
    background:
        radial-gradient(circle at 45% 45%,rgba(205,155,54,0.12),transparent 36%),
        linear-gradient(90deg,rgba(0,0,0,0.58),rgba(0,0,0,0.12) 46%,rgba(0,0,0,0.34)),
        rgba(0,0,0,0.16);
    z-index:0;
}

.container{
    position:relative;
    z-index:1;
    width:100%;
    max-width:100vw;
    min-width:0;
    display:grid;
    grid-template-columns:clamp(180px,14vw,220px) minmax(0,1fr) clamp(210px,16vw,260px);
    gap:clamp(10px,1vw,18px);
    padding:6px 14px 8px 0;
    box-sizing:border-box;
    margin:0;
}

/* ===== HEADER ===== */
.header{
    position:sticky;
    top:4px;
    align-self:start;
    text-align:center;
    min-height:calc(100vh - 8px);
    padding:24px 14px 14px;
    box-sizing:border-box;
    background:
        radial-gradient(circle at 50% 7%,rgba(245,200,75,0.2),transparent 22%),
        radial-gradient(circle at 28% 64%,rgba(245,200,75,0.11),transparent 11%),
        radial-gradient(circle at 42% 72%,rgba(245,200,75,0.08),transparent 8%),
        linear-gradient(180deg,rgba(19,17,10,0.78),rgba(5,7,6,0.84) 46%,rgba(1,3,3,0.9)),
        rgba(5,7,6,0.68);
    border:1px solid rgba(206,158,55,0.72);
    border-left:1px solid rgba(206,158,55,0.72);
    border-radius:0 6px 6px 0;
    box-shadow:
        inset 0 0 0 1px rgba(255,238,181,0.09),
        inset 0 0 28px rgba(0,0,0,0.35),
        0 0 18px rgba(0,0,0,0.35),
        0 0 18px rgba(177,128,37,0.2);
    backdrop-filter:blur(2px) saturate(1.05);
    -webkit-backdrop-filter:blur(2px) saturate(1.05);
    overflow:hidden;
}

.header::before{
    content:"";
    position:absolute;
    top:14px;
    bottom:14px;
    left:auto;
    right:0;
    width:1px;
    background:linear-gradient(180deg,transparent,#d8b86f 12%,#fff2c0 50%,#8c6a2d 88%,transparent);
    box-shadow:0 0 10px rgba(245,200,75,0.45);
    opacity:0.75;
}

.header::after{
    content:"";
    position:absolute;
    left:8px;
    right:8px;
    top:5px;
    height:1px;
    background:linear-gradient(90deg,transparent,rgba(245,200,75,0.72),transparent);
    box-shadow:0 0 8px rgba(245,200,75,0.35);
}

.main-content{
    min-width:0;
    width:100%;
    overflow-x:auto;
    -webkit-overflow-scrolling:touch;
}

.overdue-panel{
    position:sticky;
    top:4px;
    align-self:start;
    min-height:calc(100vh - 8px);
    padding:18px 14px;
    box-sizing:border-box;
    background:
        linear-gradient(160deg,rgba(255,229,158,0.12),rgba(0,0,0,0.18)),
        rgba(20,12,9,0.38);
    border:1px solid rgba(206,158,55,0.5);
    border-left:4px solid rgba(255,77,77,0.85);
    border-radius:7px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 0 18px rgba(0,0,0,0.24),
        0 0 18px rgba(177,128,37,0.16);
    backdrop-filter:blur(4px) saturate(1.1);
    -webkit-backdrop-filter:blur(4px) saturate(1.1);
}

.overdue-title{
    color:#ff4d4d;
    font-weight:900;
    letter-spacing:1.6px;
    font-size:13px;
    margin-bottom:10px;
    text-shadow:0 0 10px rgba(255,77,77,0.5);
}

.overdue-empty{
    color:#aaa;
    font-size:8px;
}

.overdue-card{
    background:rgba(20,4,6,0.45);
    border:1px solid rgba(255,77,77,0.35);
    border-left:5px solid #ff4d4d;
    border-radius:8px;
    padding:10px;
    margin-bottom:10px;
    box-shadow:0 0 16px rgba(255,77,77,0.24);
}

.overdue-card .name{
    display:block;
    margin-bottom:6px;
}

.overdue-meta{
    font-size:12px;
    color:#ddd;
    line-height:1.45;
}

.overdue-card button{
    margin-top:8px;
    width:100%;
}

.header-actions{
    margin-top:14px;
    display:flex;
    gap:8px;
    justify-content:center;
    flex-wrap:wrap;
}

#approveUsersBtn{
    flex-basis:86%;
    max-width:116px;
    margin-top:3px;
}

.timezone-wrap{
    margin-top:12px;
}

.timezone-wrap select{
    width:100%;
    max-width:190px;
    font-size:12px;
    height:22px;
    background:#ffffff;
    border:1px solid rgba(255,255,255,0.75);
    color:#000000;
    font-weight:600;
    border-radius:0;
    padding:0 4px;
    box-shadow:
        0 0 10px rgba(0,0,0,0.18);
}

.header .admin-note,
.header small{
    font-size:8px;
}

#lastEditor{
    margin-top:11px !important;
    font-size:10px !important;
    color:#d8cba9 !important;
}

.logo-frame{
    width:150px;
    height:150px;
    border-radius:50%;
    overflow:hidden;
    background:#ffffff;
    border:2px solid rgba(255,255,255,0.95);
    box-sizing:border-box;
    box-shadow:
        0 0 0 2px rgba(255,226,137,0.94),
        0 0 0 6px rgba(82,55,16,0.78),
        0 0 0 10px rgba(209,151,35,0.62),
        0 0 24px rgba(245,200,75,0.78),
        0 8px 18px rgba(0,0,0,0.78);
    margin:0 auto;
}

.logo{
    width:100%;
    height:100%;
    border-radius:50%;
    object-fit:cover;
    object-position:center;
    transform:scale(1.24);
    transform-origin:center;
    display:block;
    filter:none;
    transition:0.3s;
}

.logo-frame:hover .logo{
    transform:scale(1.28);
}

.guild{
    margin:28px auto 8px;
    padding:0;
    width:100%;
    font-size:22px;
    letter-spacing:1.5px;
    font-weight:900;
    color:#f7e8c2;
    background:transparent;
    border:0;
    text-shadow:
        0 0 12px rgba(245,200,75,0.34),
        0 2px 3px rgba(0,0,0,0.95);
}

.subguild{
    max-width:128px;
    margin:0 auto;
    font-size:8px;
    color:#d6cab0;
    letter-spacing:0.8px;
    line-height:1.45;
    overflow-wrap:break-word;
    text-shadow:0 1px 3px rgba(0,0,0,0.9);
}

h1{
    text-align:left;
    margin:10px 0 14px;
    letter-spacing:2px;
    color:#f5c84b;
    text-shadow:
        0 0 8px rgba(245,200,75,0.45),
        0 2px 4px rgba(0,0,0,0.75);
    font-size:30px;
    font-family:Georgia,'Times New Roman',serif;
    font-weight:900;
}

.search-bar{
    display:flex;
    gap:8px;
    align-items:center;
    margin:0 0 14px;
    max-width:390px;
}

.search-bar input{
    flex:1;
    min-width:0;
    padding:9px 12px;
    border-color:rgba(206,158,55,0.48);
    background:rgba(8,8,6,0.42);
}

.search-bar button{
    padding:9px 12px;
}

/* ===== TODAY BOX ===== */
.today-box{
    background:
        linear-gradient(135deg,rgba(255,219,130,0.12),rgba(255,255,255,0.035)),
        rgba(10,9,7,0.38);
    border:1px solid rgba(206,158,55,0.55);
    border-left:4px solid #ffd54f;
    border-radius:5px;
    padding:12px 14px;
    margin-bottom:12px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.12),
        0 0 18px rgba(0,0,0,0.22),
        0 0 14px rgba(177,128,37,0.16);
    backdrop-filter:blur(4px) saturate(1.1);
    -webkit-backdrop-filter:blur(4px) saturate(1.1);
}

/* ===== GRID ===== */
.row, .today-row, .today-header{
    display:grid;
    grid-template-columns: 150px 110px 100px 170px 120px 190px 95px;
 /* ✅ fixed widths */
    gap:8px;
    align-items:center;
    padding:8px 18px 8px 12px;
    font-size:12px;
    font-weight:700;
    color:#f8edc8;
    text-shadow:
        0 0 7px rgba(245,200,75,0.38),
        0 1px 3px rgba(0,0,0,0.85);
}

.today-row, .today-header{
    grid-template-columns: 150px 120px 105px 170px 130px 160px;
}

.row .status.confirming{
    font-size:13px;
}



.tod{
    display:flex;
    gap:8px;
    align-items:center;
    flex-wrap:nowrap;     /* 👈 keep in one line */
}

.tod input{
    width:100%;
    min-width:0;
    max-width:205px;
    font-size:12px;
    padding:6px;
    text-align:center;
    box-sizing:border-box;
}

button{
    flex-shrink:0;
    white-space:nowrap;
}

.row > button{
    justify-self:start;
    min-width:88px;
}


/* HEADER */
.today-header{
    font-size:12px;
    color:#f5c84b;
    font-weight:800;
    text-transform:uppercase;
    letter-spacing:1px;
    text-shadow:
        0 0 9px rgba(245,200,75,0.55),
        0 1px 3px rgba(0,0,0,0.9);
}



/* TODAY ROW */
.today-row{
    background:
        linear-gradient(135deg,rgba(255,219,130,0.1),rgba(255,255,255,0.025)),
        rgba(9,8,6,0.42);
    border:1px solid rgba(206,158,55,0.32);
    border-left:4px solid #ffd54f;
    border-radius:4px;
    margin:4px 0;
    box-shadow:inset 0 1px 0 rgba(255,255,255,0.1);
    backdrop-filter:blur(3px) saturate(1.08);
    -webkit-backdrop-filter:blur(3px) saturate(1.08);
}

/* STATUS COLORS */
.alive{ border-left-color:#00ff9c; }
.today{ border-left-color:#ffd54f; }
.soon{ border-left-color:#ff4d4d; }


.today-row .status.soon{
    color:#ff4d4d;
    font-weight:bold;
}

.status.confirming{
    color:#ff4d4d;
    font-weight:bold;
    line-height:1.2;
    white-space:normal;
}

.status.confirming::before{ background:#ff4d4d; }



/* STATUS TEXT */
.status::before{
    content:"";
    display:inline-block;
    width:8px;
    height:8px;
    border-radius:50%;
    margin-right:6px;
    vertical-align:middle;
    background:#666;
}

.status.alive::before{ background:#00ff9c; }
.status.today::before{ background:#ffd54f; }
.status.soon::before{ background:#ff4d4d; }
.status.scheduled::before{ background:#888; }
.status.set::before{ background:#555; }
.status.tomorrow::before{ background:#00b0ff; }
.tomorrow{ border-left-color:#00b0ff; }

/* BLINK */
.blink{
    animation:blink 1s infinite;
}
@keyframes blink{
    50%{opacity:0.4;}
}

/* COLUMNS */
.name{
    color:#00e5ff;
    font-weight:900;
    font-size:14px;
    white-space:nowrap;
    overflow:hidden;
    text-overflow:ellipsis;
    text-shadow:
        0 0 8px rgba(0,229,255,0.65),
        0 1px 3px rgba(0,0,0,0.9);
}
.boss-category{
    color:#f5c84b;
    font-size:10px;
    margin-left:5px;
    font-weight:800;
    text-shadow:0 0 7px rgba(245,200,75,0.5);
}
.status{
    font-size:13px;
    font-weight:900;
    white-space:nowrap;
}
.spawn-time{
    color:#f8edc8;
    font-size:12px;
    line-height:1.25;
    font-weight:800;
    white-space:nowrap;
}
.respawn{
    color:#fff4cf;
    font-size:13px;
    font-weight:800;
    white-space:nowrap;
}
.respawn input{
    width:100%;
    max-width:190px;
    margin-top:5px;
    font-size:12px;
    padding:4px;
    box-sizing:border-box;
}
.cd{
    color:#00ff9c;
    font-size:13px;
    font-weight:900;
    white-space:nowrap;
    text-shadow:
        0 0 8px rgba(0,255,156,0.55),
        0 1px 3px rgba(0,0,0,0.9);
}

/* INPUT */
input{
    background:rgba(8,10,14,0.42);
    border:1px solid rgba(255,255,255,0.16);
    color:white;
    padding:4px;
    border-radius:4px;
}


/* 🔥 FORCE WHITE CALENDAR ICON */
input[type="datetime-local"]::-webkit-calendar-picker-indicator{
    filter: invert(1) brightness(2) contrast(1.2);
    opacity: 1;
}

/* Fix entire input look */
input[type="datetime-local"]{
    background: #ffffff !important;
    color: #000000 !important;
}

button{
    background:
        linear-gradient(180deg,rgba(255,221,130,0.18),rgba(66,48,17,0.44) 48%,rgba(10,8,5,0.72) 49%,rgba(31,24,12,0.84));
    border:1px solid rgba(220,169,55,0.58);
    color:#f8edc8;
    padding:5px 8px;
    border-radius:3px;
    cursor:pointer;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.18),
        0 2px 8px rgba(0,0,0,0.38);
    text-shadow:0 1px 2px rgba(0,0,0,0.9);
    backdrop-filter:blur(3px);
    -webkit-backdrop-filter:blur(3px);
}

.header button{
    color:#ffffff;
    font-weight:500;
    font-size:12px;
    padding:7px 10px;
    border-color:rgba(255,255,255,0.2);
    min-width:0;
    background:
        linear-gradient(180deg,rgba(255,255,255,0.16),rgba(255,255,255,0.08)),
        rgba(120,124,128,0.42);
    border-radius:5px;
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.2),
        0 0 10px rgba(0,0,0,0.22);
}

.header button:hover,
#discordSyncBtn:hover{
    color:#fff7dc;
    border-color:rgba(255,226,151,0.82);
    box-shadow:
        inset 0 1px 0 rgba(255,255,255,0.22),
        0 0 14px rgba(245,200,75,0.28);
}

.section-title{
    margin-top:20px;
    font-size:15px;
    color:#f5c84b;
    font-weight:900;
    letter-spacing:2px;
    text-shadow:
        0 0 10px rgba(245,200,75,0.55),
        0 1px 3px rgba(0,0,0,0.9);
}

#soundUI{
  margin-top:12px;
  display:flex;
  flex-direction:row;
  gap:9px;
  align-items:center;
  justify-content:center;
  min-height:0;
  background:
      linear-gradient(180deg,rgba(255,255,255,0.16),rgba(255,255,255,0.05)),

  display:none;
}

.discord-logo{
  width:20px;
  height:20px;
  color:#ffd76a;
  filter:drop-shadow(0 0 7px rgba(245,200,75,0.55));
  flex:0 0 auto;
}


/* ===== MOBILE RESPONSIVE ===== */
@media (max-width: 900px){

    .container{
        width:100%;
        min-width:0;
        max-width:100vw;
        padding:10px;
        display:block;
    }

    .header{
        position:relative;
        top:auto;
        min-height:auto;
        margin-bottom:14px;
        border-radius:12px;
    }

    .main-content{
        width:100%;
        overflow-x:auto;
        -webkit-overflow-scrolling:touch;
        padding-bottom:8px;
    }

    .overdue-panel{
        position:relative;
        top:auto;
        min-height:auto;
        margin-top:14px;
    }

    .logo{
        width:90px;
        height:90px;
    }

    h1{
        font-size:20px;
        letter-spacing:1px;
        text-align:center;
    }

    .today-box,
    #dynamic,
    #fixed,
    #kransia{
        min-width:680px;
    }

    /* Compact one-line rows on phones */
    .row, .today-row, .today-header{
        grid-template-columns: 118px 82px 72px 140px 100px 125px 65px;
        grid-template-rows:auto;
        gap:6px;
        padding:6px 8px;
        font-size:10px;
        line-height:1.15;
    }

    .today-row, .today-header{
        grid-template-columns: 118px 82px 72px 140px 100px 125px;
    }

    .today-header{
        display:grid;
        font-size:9px;
        letter-spacing:0.5px;
    }

    .name,
    .status,
    .spawn-time,
    .respawn,
    .cd,
    .tod{
        grid-column:auto;
        white-space:nowrap;
    }

    .name{ font-size:11px; }
    .boss-category{ font-size:8px; margin-left:3px; }
    .status{ font-size:10px; }
    .spawn-time{ font-size:9px; overflow:hidden; text-overflow:ellipsis; }

const TZ_FORMATTERS = {};
const TZ_WEEKDAY_FORMATTERS = {};
const WEEKDAY_TO_NUM = {Sun:0,Mon:1,Tue:2,Wed:3,Thu:4,Fri:5,Sat:6};

function getTZFormatter(timeZone){
    if(!TZ_FORMATTERS[timeZone]){
        TZ_FORMATTERS[timeZone] = new Intl.DateTimeFormat("en-US", {
            timeZone,
            year: "numeric",
            month: "2-digit",
            day: "2-digit",
            hour: "2-digit",
            minute: "2-digit",
            second: "2-digit",
            hourCycle: "h23"
        });
    }
    return TZ_FORMATTERS[timeZone];
}

function getTZParts(date, timeZone = selectedTZ){
    let parts = {};

    getTZFormatter(timeZone).formatToParts(date).forEach(part => {
        if(part.type !== "literal"){
            parts[part.type] = Number(part.value);
        }
    });

    parts.millisecond = date.getMilliseconds();
    return parts;
}

function getZonedDay(date, timeZone = selectedTZ){
    if(!TZ_WEEKDAY_FORMATTERS[timeZone]){
        TZ_WEEKDAY_FORMATTERS[timeZone] = new Intl.DateTimeFormat("en-US", {
            timeZone,
            weekday: "short"
        });
    }

    return WEEKDAY_TO_NUM[TZ_WEEKDAY_FORMATTERS[timeZone].format(date)];
}

function dateFromTZParts(year, month, day, hour = 0, minute = 0, second = 0, millisecond = 0, timeZone = selectedTZ){
    let target = Date.UTC(year, month - 1, day, hour, minute, second, millisecond);
    let guess = target;

    for(let i = 0; i < 3; i++){
        let parts = getTZParts(new Date(guess), timeZone);
        let asUTC = Date.UTC(
            parts.year,
            parts.month - 1,
            parts.day,
            parts.hour,
            parts.minute,
            parts.second,
            millisecond
        );

        guess += target - asUTC;
    }

    return new Date(guess);
}

function addDaysInTZ(date, days, timeZone = selectedTZ){
    let parts = getTZParts(date, timeZone);

    return dateFromTZParts(
        parts.year,
        parts.month,
        parts.day + days,
        parts.hour,
        parts.minute,
        parts.second,
        parts.millisecond,
        timeZone
    );
}

function parseDiscordTimeToDate(timeText, dayOffset = 0){
    let match = timeText.trim().match(/^(\d{1,2})(?::(\d{2}))?\s*(AM|PM)$/i);
    if(!match) return null;

    let hour = Number(match[1]);
    let minute = Number(match[2] || 0);
    let meridian = match[3].toUpperCase();

    if(meridian === "PM" && hour !== 12) hour += 12;
    if(meridian === "AM" && hour === 12) hour = 0;

    let base = addDaysInTZ(new Date(), dayOffset, selectedTZ);
    let parts = getTZParts(base, selectedTZ);

    return dateFromTZParts(parts.year, parts.month, parts.day, hour, minute, 0, 0, selectedTZ);
}

    let updated = [];
    let ignored = [];

    text.split(/\r?\n/).forEach(rawLine => {
        let line = rawLine.trim();
        if(!line) return;

        if(/tomorrow/i.test(line)){
            dayOffset = 1;
            return;
        }

        if(/today/i.test(line)){
            dayOffset = 0;
            return;

            if(saveDiscordRespawn(bossName, respawnDate)){

            let bossName = todMatch[1].trim();

            if(saveDiscordTOD(bossName, todDate)){
                updated.push(`${bossName} TOD ${todMatch[2]}`);
            }else{
                ignored.push(line);
            }
            return;
        }

        let simpleMatch = line.match(/^([A-Za-z ]+?)\s+(\d{1,2}(?::\d{2})?\s*(?:AM|PM))$/i);
        if(simpleMatch){
            let bossName = simpleMatch[1].replace(/^Kransia:\s*/i, "").trim();

            let boss = resolveDynamicBoss(bossName);

            if(boss){
            if(saveDiscordRespawn(bossName, eventDate)){
                updated.push(`${bossName} TOD ${simpleMatch[2]}`);
            }else{
                ignored.push(line);
            }   
        }else{

        }

function playBeep(times = 3){
    if(!audioCtx || !soundEnabled) return;
    for(let i = 0; i < times; i++){
        setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const gain = audioCtx.createGain();

            osc.type = "square"; // sharper/louder
            osc.frequency.value = 1000;

            gain.gain.value = volumeLevel; // 🔊 volume (0.5–1 = loud)

            osc.connect(gain);
            gain.connect(audioCtx.destination);

            osc.start();
            osc.stop(audioCtx.currentTime + 0.15); // short beep
        }, i * 200); // spacing between beeps
    }
}

function approveUsers(){
    if(userRole !== "admin"){
        alert("Admin only");
        return;
    }

    db.ref("users").once("value").then(snap => {
        let users = [];

        snap.forEach(child => {
            let user = child.val();
            if(user){
                users.push({
                    name: child.key,
                    role: user.role || "pending",
                    approved: user.approved !== false && user.role !== "pending",
                    approvedBy: user.approvedBy || "--"
                });
            }
        });

        if(!users.length){
            alert("No registered users");
            return;
        }

        users.sort((a,b) => {
            if(a.approved === b.approved) return a.name.localeCompare(b.name);
            return a.approved ? 1 : -1;
        });

        let list = users.map(user => {
            let status = user.approved ? "APPROVED" : "PENDING";
            return `${user.name} - ${status} - ${user.role}`;
        }).join("\n");

        let selected = prompt("Registered users:\n" + list + "\n\nType username to manage:");
        if(!selected) return;

        selected = cleanUserKey(selected);

        if(!users.some(user => user.name === selected)){
            alert("User not found");
            return;
        }

        let action = prompt("Action for " + selected + ":\nType elite, admin, or delete", "elite");
        if(!action) return;

        action = action.trim().toLowerCase();

        if(action === "delete"){
            if(selected === currentUser){
                alert("You cannot delete your own admin account while logged in.");
                return;
            }

            if(!confirm("Delete user " + selected + "? This removes their login account.")){
                return;
            }

            db.ref("users/" + selected).remove().then(() => {
                alert(selected + " deleted");
            }).catch(err => {
                console.log("Delete user error:", err);
                alert("Delete failed");
            });
            return;
        }

        if(!["elite","admin"].includes(action)){
            alert("Invalid action. Use elite, admin, or delete.");
            return;
        }

        db.ref("users/" + selected).update({
            role: action,
            approved: true,
            approvedBy: currentUser,
            approvedAt: firebase.database.ServerValue.TIMESTAMP
        }).then(() => {
            alert(selected + " is now " + action);
        }).catch(err => {
            console.log("Approve error:", err);
            alert("Update failed");
        });
    });
}

// ===== CALC =====
function nextInterval(tod, h){
    if(!tod) return null;

    let base = new Date(tod).getTime();

    if(isNaN(base)) return null;

    let interval = h * 3600000;

    // TOD is the killed/dead time. First respawn is after the boss interval.
    let next = base + interval;

    return new Date(next);
}


function nextSchedule(times, bossName){

    let now = getNowInTZ();
    let nowParts = getTZParts(now, SCHEDULE_TZ);
    let nowDay = getZonedDay(now, SCHEDULE_TZ);

    let allTimes = [];

    times.forEach(([day, t]) => {

        let [h, m] = t.split(":");
        let diff = DAY_MAP[day] - nowDay;
        if (diff < 0) diff += 7;

        let upcoming = dateFromTZParts(
            nowParts.year,
            nowParts.month,
            nowParts.day + diff,
            Number(h),
            Number(m),
            0,
            0,
            SCHEDULE_TZ
        );

        allTimes.push(upcoming);
        allTimes.push(addDaysInTZ(upcoming, -7, SCHEDULE_TZ));
    });

    // sort ascending
    allTimes.sort((a, b) => a - b);

    let overdue = allTimes
        .filter(t => t <= now)
        .sort((a,b) => b - a)
        .find(t => !confirmedBosses[getConfirmKey(bossName, t)]);

    if(overdue){
        return overdue;
    }

    for (let t of allTimes) {

    let diff = now - t;

    // ❗ DO NOT jump immediately if just passed
    if (diff < 0) {
        return t;
    }
}

    // ✅ ALL PASSED → next week
    return addDaysInTZ(allTimes[0], 7, SCHEDULE_TZ);
}

function cd(n){
    if(!n) return "--";

    let diff = (n.getTime() - getNowInTZ().getTime()) / 1000; // ✅ FIX

    if(diff <= 0) return "ALIVE";

    let h = Math.floor(diff / 3600);
    let m = Math.floor(diff % 3600 / 60);
    let s = Math.floor(diff % 60);

    return `${h}h ${m}m ${s}s`;
}

[

]

.forEach(b => {

    let n;

if(b.type === "dyn"){
    let tod = loadTOD(b.name);
n = nextInterval(tod, b.h);
}else{
    n = nextSchedule(b.times, b.name);
}

if(n){

}

    let row=document.getElementById("row_"+b.name);

let status = "ALIVE";
let statusKey = "alive";

if(n){

            status = "TODAY";

            row.classList.add("today");
            showToday = isSameDay(n, getNowInTZ());
        }else{
        status = "BOSS RESPAWN NOT YET CONFIRMED DEAD";
        statusKey = "confirming";

        // Dynamic bosses move immediately. Fixed/Kransia bosses move here
        // after a 5-minute grace period until admin/elite confirms them.
        showToday = false;
        overdueList.push({
            name: b.name,
            displayName: formatBossName(b),
            time: n,
            type: b.type,
            category: getBossCategory(b),
            spawnTime: formatSpawnTime(b),
            diff: diff
        });

        if(!notifiedBosses[b.name + "_confirming"]){
            playBeep(3);
            notifiedBosses[b.name + "_confirming"] = true;
        }
        }
    }
    else if(diff > 0 && diff <= 300){
        status = "SOON";

    }
    else if(isSameDay(n, getNowInTZ())){

    else if(isSameDay(n, getTomorrow())){

    // ✅ ONLY ONE PUSH (FIXED)

        todayList.push({
            name: b.name,
            displayName: formatBossName(b),
            time: n,
            status: status,
            statusKey: statusKey,
            spawnTime: formatSpawnTime(b),
            diff: diff
        });
    }
}
    let sEl = document.getElementById("s_"+b.name);
sEl.innerText = status;
sEl.className = "status " + statusKey;

let respawnEl = document.getElementById("r_"+b.name);

// ALWAYS show respawn

db.ref("bosses").on("value", snapshot => {

        const input = document.getElementById("tod_" + name);
        if(input && document.activeElement !== input){
            input.value = formatForInput(bossData[name]);
        }
    });

// ✅ LOGS LISTENER (SEPARATE — NOT INSIDE BOSSES)
db.ref("logs").on("value", snap => {

    bossLogs = {};
    lastGlobalLog = null;

    snap.forEach(child => {
        let data = child.val();

        // ✅ per boss latest
        if(!bossLogs[data.boss] || new Date(data.time) > new Date(bossLogs[data.boss].time)){
            bossLogs[data.boss] = data;
        }

        // ✅ global latest
        if(!lastGlobalLog || new Date(data.time) > new Date(lastGlobalLog.time)){
            lastGlobalLog = data;
        }
    });

    updateLastEditor(); // 🔥 NEW
    update();
});

db.ref("confirmed").on("value", snap => {

function updateLastEditor(){

    let el = document.getElementById("lastEditor");
    if(!el) return;

    if(lastGlobalLog){

        let time = new Date(lastGlobalLog.time).toLocaleTimeString("en-US", {
            hour: "2-digit",
            minute: "2-digit",
            timeZone: selectedTZ
        });

        el.innerHTML = `
            Last edit: 
            <span style="color:#00ff9c;">${lastGlobalLog.editedBy}</span>
            • ${time}
        `;
    }else{
        el.innerText = "Last edit: --";
    }
}
